name: nfc_manager_platform_interface

on:
  push:
    branches: [main]
    paths: &ci_paths
      - 'nfc_manager_platform_interface/**'
      - '.github/workflows/nfc_manager_platform_interface.yaml'
      - '.github/workflows/_package.yaml'
      - 'mise.toml'
      - 'mise.lock'
  pull_request:
    paths: *ci_paths

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_package.yaml
    with:
      package: nfc_manager_platform_interface
