name: nfc_manager

on:
  push:
    branches: [main]
    paths: &ci_paths
      - 'nfc_manager/**'
      - 'nfc_manager_android/**'
      - 'nfc_manager_platform_interface/**'
      - '.github/workflows/nfc_manager.yaml'
      - 'mise.toml'
  pull_request:
    paths: *ci_paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nfc_manager

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: "2026.10.2"
          install_args: "flutter"

      - name: Cache flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml', '**/example/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-
      - name: Install dependencies
        run: flutter pub get --no-example
      - name: Install example dependencies
        working-directory: ./nfc_manager/example
        run: flutter pub get --enforce-lockfile

      - name: Format code
        run: dart format --set-exit-if-changed .
      - name: Analyze code
        run: flutter analyze
      - name: Run code metrics
        run: dart run dart_code_linter:metrics analyze . --set-exit-on-violation-level=warning
      - name: Run tests
        run: |
          flutter test --coverage --test-randomize-ordering-seed=random
          dart run test_cov_console
