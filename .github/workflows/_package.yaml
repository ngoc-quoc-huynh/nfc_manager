name: package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory to check.
        type: string
        required: true

permissions:
  contents: read

# `github.workflow` is the caller's name, so every package gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  development:
    name: Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./${{ inputs.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: "2026.10.5"
          install_args: flutter

      - name: Cache flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml', '**/example/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get --no-example
      - name: Install example dependencies
        run: |
          if [ -d example ]; then
            cd example
            flutter pub get --enforce-lockfile
          fi

      - name: Check code
        run: make check-dart PUB_FLAGS=--no-pub
      - name: Run tests
        run: make test PUB_FLAGS=--no-pub
      - name: Check example
        run: |
          if [ -d example ]; then
            make check-example
          fi

  legacy:
    name: Minimum Flutter analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./${{ inputs.package }}

    env:
      # Minimum supported Flutter version (see pubspec.yaml).
      MISE_FLUTTER_VERSION: '3.44.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # `mise x` installs the pinned minimum Flutter on demand, so skip the
      # default install of the repo's current Flutter.
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: "2026.10.5"
          install: false

      - name: Log Flutter version
        run: mise x flutter@${{ env.MISE_FLUTTER_VERSION }} -- flutter --version

      - name: Install dependencies
        run: mise x flutter@${{ env.MISE_FLUTTER_VERSION }} -- flutter pub get --no-example
      # Compile compatibility only: the repo lint set needs a newer Dart.
      - name: Analyze code
        run: mise x flutter@${{ env.MISE_FLUTTER_VERSION }} -- flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
