name: package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory to check.
        type: string
        required: true
      android:
        description: Also run the Android unit tests and lint (Java and Gradle).
        type: boolean
        default: false
      apk:
        description: Also build the example debug APK (Java and Gradle).
        type: boolean
        default: false

permissions:
  contents: read

# `github.workflow` is the caller's name, so every package gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./${{ inputs.package }}

jobs:
  development:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.5"
          install_args: ${{ (inputs.android || inputs.apk) && 'flutter java' || 'flutter' }}

      - name: Cache flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml', '**/example/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-
      - name: Install dependencies
        run: flutter pub get --no-example
      - name: Install example dependencies
        run: |
          if [ -d example ]; then
            cd example
            flutter pub get --enforce-lockfile
          fi

      - name: Check code
        run: make check PUB_FLAGS=--no-pub
      - name: Run tests
        run: make test PUB_FLAGS=--no-pub

      - name: Setup Gradle
        if: inputs.android || inputs.apk
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run Android tests and lint
        if: inputs.android
        run: make android
      - name: Build example APK
        if: inputs.apk
        working-directory: ./${{ inputs.package }}/example
        run: flutter build apk --debug --no-pub

  legacy:
    name: Minimum Flutter analysis
    runs-on: ubuntu-latest
    env:
      # Latest patch of the minimum supported Flutter minor (see pubspec.yaml).
      MISE_FLUTTER_VERSION: '3.44.9'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `mise x` installs the pinned minimum Flutter on demand, so skip the
      # default install of the repo's current Flutter.
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.5"
          install: false

      - name: Install dependencies
        run: mise x flutter@${{ env.MISE_FLUTTER_VERSION }} -- flutter pub get --no-example
      # Compile compatibility only: the repo lint set needs a newer Dart.
      - name: Analyze code
        run: mise x flutter@${{ env.MISE_FLUTTER_VERSION }} -- flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
