name: package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory to check.
        type: string
        required: true
      android:
        description: Also run the Android unit tests and lint (Java and Gradle).
        type: boolean
        default: false

permissions:
  contents: read

# `github.workflow` is the caller's name, so every package gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./${{ inputs.package }}

jobs:
  development:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: "2026.10.5"
          install_args: ${{ inputs.android && 'flutter java' || 'flutter' }}

      - name: Cache flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml', '**/example/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-
      - name: Install dependencies
        run: flutter pub get --no-example
      - name: Install example dependencies
        run: |
          if [ -d example ]; then
            cd example
            flutter pub get --enforce-lockfile
          fi

      - name: Format code
        run: dart format --set-exit-if-changed lib test
      - name: Analyze code
        run: flutter analyze --no-pub lib test
      - name: Run code metrics
        run: dart run dart_code_linter:metrics analyze lib test --set-exit-on-violation-level=warning
      - name: Run tests
        run: |
          flutter test --no-pub --coverage --test-randomize-ordering-seed=random
          dart run test_cov_console

      - name: Check example
        run: |
          if [ -d example ]; then
            cd example
            dart format --set-exit-if-changed .
            flutter analyze --no-pub
            dart run dart_code_linter:metrics analyze . --set-exit-on-violation-level=warning
          fi

      - name: Setup Gradle
        if: inputs.android
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Run Android tests and lint
        if: inputs.android
        working-directory: ./${{ inputs.package }}/example/android
        run: ./gradlew :nfc_manager_android:testDebugUnitTest :nfc_manager_android:lintDebug --build-cache

  legacy:
    name: Minimum Flutter analysis
    runs-on: ubuntu-latest
    env:
      # Latest patch of the minimum supported Flutter minor (see pubspec.yaml).
      MISE_FLUTTER_VERSION: '3.44.9'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # `mise x` installs the pinned minimum Flutter on demand, so skip the
      # default install of the repo's current Flutter.
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: "2026.10.5"
          install: false

      - name: Install dependencies
        run: mise x flutter@${{ env.MISE_FLUTTER_VERSION }} -- flutter pub get --no-example
      # Compile compatibility only: the repo lint set needs a newer Dart.
      - name: Analyze code
        run: mise x flutter@${{ env.MISE_FLUTTER_VERSION }} -- flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
