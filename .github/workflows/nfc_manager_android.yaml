name: nfc_manager_android

on:
  push:
    paths:
      - 'nfc_manager_android/**'
      - '.github/workflows/nfc_manager_android.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nfc_manager_android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.2"
          install_args: "flutter java"

      - name: Cache flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('./nfc_manager_android/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-
      - name: Install dependencies
        run: flutter pub get

      - name: Create local.properties
        working-directory: ./nfc_manager_android/example/android
        run: |
          FLUTTER_PATH=$(mise where flutter)
          echo "flutter.sdk=$FLUTTER_PATH" > ./local.properties
      - name: Run android tests
        working-directory: ./nfc_manager_android/example/android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Format code
        run: dart format --set-exit-if-changed .
      - name: Analyze code
        run: flutter analyze
      - name: Run code metrics
        run: dart run dart_code_linter:metrics analyze . --set-exit-on-violation-level=warning
      - name: Run tests
        run: |
          flutter test --coverage --test-randomize-ordering-seed=random
          dart run test_cov_console
