body:
  - type: markdown
    attributes:
      value: |
        Before filling out the discussion fields, please consider the following:
        - Search for any [existing bugs](https://github.com/ngoc-quoc-huynh/nfc_manager/discussions/categories/report-a-bug).
        - Redact card identifiers, APDU payloads, PINs, and other credentials from screenshots and logs.

  - type: input
    attributes:
      label: Plugin version
      description: The release tag or commit from your git dependency.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    attributes:
      label: Flutter version
      description: Provide the first line of `flutter --version`.
      placeholder: Flutter 3.x.x • channel stable • …
    validations:
      required: true

  - type: input
    attributes:
      label: Android version
      description: >-
        If a device is involved, specify its Android version. Leave blank if no device is involved.
      placeholder: Android 15 (API 35)

  - type: input
    attributes:
      label: Device
      description: >-
        If a device is involved, specify its manufacturer and model. Leave blank if no device is involved.
      placeholder: Google Pixel 8

  - type: dropdown
    attributes:
      label: Mode
      description: >-
        Select whether the bug occurs when reading tags, emulating a card, or if the mode is not applicable or unknown.
      options:
        - Reader
        - Host card emulation (HCE)
        - Both
        - Not applicable / unknown
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description
      description: Provide a detailed description of the bug you encountered.
      placeholder: Describe the issue you're facing …
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Describe the steps you took to encounter the bug.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
      placeholder: What should happen instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots
      description: >-
        Drag images here or paste links that help illustrate the issue (if applicable).
      placeholder: Drag images here or paste links …

  - type: textarea
    attributes:
      label: Additional information
      description: >-
        Provide any other useful information, such as the tag technology or external reader model.
      placeholder: Tag technology, external reader model, or other relevant details …
