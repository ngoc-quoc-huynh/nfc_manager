name: nfc_manager_platform_interface
description: A common platform interface for the nfc_manager plugin.
publish_to: none
version: 2.0.0

environment:
  sdk: ^3.12.0
  # Support apps using Flutter 3.44.0 or newer.
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  test_cov_console: ^0.2.2

  # Linter
  # 0.14 is the newest release resolving on Dart 3.12, 0.16 on the newest SDK.
  cosee_lints: '>=0.14.0 <0.17.0'
  dart_code_linter: ^4.0.0
