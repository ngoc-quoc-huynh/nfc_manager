name: nfc_manager_android
description: The Android implementation of nfc_manager.
publish_to: none
version: 2.0.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  nfc_manager_platform_interface:
    path: ../nfc_manager_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  # After a Pigeon update, run `make pigeon`; CI checks the generated files.
  pigeon: ^30.0.4
  test_cov_console: ^0.2.2

  # Linter
  # Keep a Dart 3.12-compatible lint release.
  # Opt in to new lint minors explicitly.
  cosee_lints: '>=0.14.0 <0.17.0'
  dart_code_linter: ^4.0.0

flutter:
  plugin:
    implements: nfc_manager
    platforms:
      android:
        package: dev.huynh.nfc_manager_android
        pluginClass: NfcManagerPlugin
        dartPluginClass: NfcManagerAndroidPlatform
