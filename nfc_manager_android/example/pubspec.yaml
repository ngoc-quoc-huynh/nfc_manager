name: nfc_manager_android_example
description: Demonstrates how to use the nfc_manager_android plugin.
publish_to: none
version: 1.0.0+1

# Keep examples on the latest stable Flutter SDK.
environment:
  sdk: ^3.13.5
  flutter: ^3.47.6

dependencies:
  flutter:
    sdk: flutter
  nfc_manager_android:
    path: ../
  nfc_manager_platform_interface:
    path: ../../nfc_manager_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter
  cosee_lints: ^0.16.0
  dart_code_linter: ^4.0.0

flutter:
  uses-material-design: true
