version: 1.0.0+1

# Keep examples on the latest stable Flutter SDK.
environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  flutter:
    sdk: flutter
  nfc_manager:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter
  cosee_lints: ^0.16.0
  dart_code_linter: ^4.0.0

flutter:
  uses-material-design: true
