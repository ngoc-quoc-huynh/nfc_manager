name: nfc_manager
description: Discover ISO-DEP tags, exchange APDU commands, and emulate cards with HCE on Android.
publish_to: none
version: 1.2.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  nfc_manager_android:
    path: ../nfc_manager_android
  nfc_manager_platform_interface:
    path: ../nfc_manager_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  test_cov_console: ^0.2.2

  # Linter
  # Keep a Dart 3.12-compatible lint release.
  # Opt in to new lint minors explicitly.
  cosee_lints: '>=0.14.0 <0.17.0'
  dart_code_linter: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: nfc_manager_android
