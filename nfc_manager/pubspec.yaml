name: nfc_manager
description: A Flutter plugin for managing NFC (Near Field Communication) interactions.
publish_to: none
version: 1.2.0

environment:
  sdk: ^3.9.0
  # Support apps using Flutter 3.35.0 or newer.
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  nfc_manager_platform_interface:
    path: ../nfc_manager_platform_interface
  nfc_manager_android:
    path: ../nfc_manager_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  test_cov_console: ^0.2.2

  # Linter
  # Allow older Dart SDKs to select a compatible lint release.
  cosee_lints: '>=0.11.0 <1.0.0'
  dart_code_linter: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: nfc_manager_android
